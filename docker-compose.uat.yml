name: factory-flow-uat

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: factoryflow
      POSTGRES_USER: factoryflow
      POSTGRES_PASSWORD: ${UAT_POSTGRES_PASSWORD:-changeme-uat}
    volumes:
      - ./data/postgres-uat:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factoryflow -d factoryflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    ports:
      - "5002:5000"
    labels:
      cloudflare.tunnel.id: 40f3dc64-4193-4417-9214-c5d7fe1eab39
    environment:
      DATABASE_URL: postgres://factoryflow:${UAT_POSTGRES_PASSWORD:-changeme-uat}@db:5432/factoryflow
      SESSION_SECRET: ${UAT_SESSION_SECRET:-uat-session-secret-change-me}
      POSTMARK_API_KEY: ${POSTMARK_API_KEY:-}
      APP_URL: ${APP_URL:-http://localhost:5000}
      AGENT_GATEWAY_URL: ${AGENT_GATEWAY_URL:-http://host.docker.internal:8787}
      AGENT_GATEWAY_API_KEY: ${AGENT_GATEWAY_API_KEY:-dev-key}
      GITHUB_FEEDBACK_TOKEN: ${GITHUB_FEEDBACK_TOKEN:-}
      GITHUB_FEEDBACK_OWNER: ${GITHUB_FEEDBACK_OWNER:-}
      GITHUB_FEEDBACK_REPO: ${GITHUB_FEEDBACK_REPO:-}
      TUNNEL_ID: ${UAT_TUNNEL_ID:-40f3dc64-4193-4417-9214-c5d7fe1eab39}
      PORT: 5000
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  backup:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: ${UAT_POSTGRES_PASSWORD:-changeme-uat}
    volumes:
      - ./data/backups-uat:/backups
    entrypoint: >
      sh -c "
        while true; do
          FILENAME=/backups/factoryflow_$$(date +%Y%m%d_%H%M%S).sql.gz
          echo \"[backup] dumping to $$FILENAME\"
          pg_dump -h db -U factoryflow factoryflow | gzip > $$FILENAME
          find /backups -name 'factoryflow_*.sql.gz' -mtime +90 -delete
          echo \"[backup] done. sleeping 6h\"
          sleep 21600
        done
      "
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
