services:
  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgres://factoryflow:${POSTGRES_PASSWORD:-changeme}@db:5432/factoryflow
      SESSION_SECRET: ${SESSION_SECRET:-dev-session-secret-change-in-production}
      POSTMARK_API_KEY: ${POSTMARK_API_KEY:-}
      PORT: 5000
      NODE_ENV: development
    volumes:
      # Mount source code for live reload
      - .:/app
      # Keep the container's node_modules (native binaries compiled for linux/alpine)
      - /app/node_modules
    entrypoint: ["./docker-entrypoint.dev.sh"]
    depends_on:
      db:
        condition: service_healthy
