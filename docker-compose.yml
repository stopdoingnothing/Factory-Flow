name: factory-flow

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: factoryflow
      POSTGRES_USER: factoryflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      # Bind mount keeps DB files on the host filesystem, independent of Docker.
      # This survives Docker reinstalls, volume corruption, and container rebuilds.
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factoryflow -d factoryflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgres://factoryflow:${POSTGRES_PASSWORD:-changeme}@db:5432/factoryflow
      SESSION_SECRET: ${SESSION_SECRET:-dev-session-secret-change-in-production}
      POSTMARK_API_KEY: ${POSTMARK_API_KEY:-}
      APP_URL: ${APP_URL:-http://localhost:5000}
      AGENT_GATEWAY_URL: ${AGENT_GATEWAY_URL:-http://host.docker.internal:8787}
      AGENT_GATEWAY_API_KEY: ${AGENT_GATEWAY_API_KEY:-dev-key}
      GITHUB_FEEDBACK_TOKEN: ${GITHUB_FEEDBACK_TOKEN:-}
      GITHUB_FEEDBACK_OWNER: ${GITHUB_FEEDBACK_OWNER:-}
      GITHUB_FEEDBACK_REPO: ${GITHUB_FEEDBACK_REPO:-}
      PORT: 5000
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  backup:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      # Backups also land on the host, in a separate directory from live data.
      - ./data/backups:/backups
    # Runs pg_dump every 6 hours (4x/day). Keeps the last 90 days of dumps (360 files max).
    # Each dump is named with a timestamp for easy point-in-time recovery.
    entrypoint: >
      sh -c "
        while true; do
          FILENAME=/backups/factoryflow_$$(date +%Y%m%d_%H%M%S).sql.gz
          echo \"[backup] dumping to $$FILENAME\"
          pg_dump -h db -U factoryflow factoryflow | gzip > $$FILENAME
          # Delete dumps older than 90 days
          find /backups -name 'factoryflow_*.sql.gz' -mtime +90 -delete
          echo \"[backup] done. sleeping 6h\"
          sleep 21600
        done
      "
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
